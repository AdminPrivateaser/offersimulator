    // ─── URL params (pré-remplissage Salesforce) ─────────────────────────────
    function fromUrl() {
      const p = new URLSearchParams(window.location.search);
      if (![...p.keys()].length) return EMPTY_FORM;
      const get = (k, fb) => p.has(k) ? p.get(k) : fb;

      // offer : "Advanced" → "advanced", "Joy Only" → "joy-only"
      const offerRaw = get('offer', '');
      const offerKey = (() => {
        const s = offerRaw.toLowerCase().replace(/\s+/g, '-');
        return OFFER_KEYS.includes(s) ? s : EMPTY_FORM.offer;
      })();

      // band : emoji couleur dans "3 🟢" → red/green/blue
      const pvRaw = get('privateasersearch', '');
      const band = (pvRaw.includes('🟢') || pvRaw.includes('🟩')) ? 'green'
                 : (pvRaw.includes('🔴') || pvRaw.includes('🟥') || pvRaw.includes('🔺')) ? 'red'
                 : (pvRaw.includes('🔵') || pvRaw.includes('🟦') || pvRaw.includes('💙')) ? 'blue'
                 : (pvRaw.includes('🟠') || pvRaw.includes('🟡') || pvRaw.includes('🧡') || pvRaw.includes('💛')) ? 'red'
                 : get('band', EMPTY_FORM.band);

      // engagement : "Annual" → "annual", "Monthly" → "monthly"
      const engRaw = get('contractengagement', get('engagement', ''));
      const engagement = engRaw.toLowerCase().startsWith('annual')  ? 'annual'
                       : engRaw.toLowerCase().startsWith('monthly') ? 'monthly'
                       : EMPTY_FORM.engagement;

      // healthScore : extrait le dernier nombre de "3 🟢 139"
      const hsRaw = get('healthScore', get('healthscore', ''));
      const hsMatch = hsRaw.match(/(\d+)\s*$/);
      const healthScore = hsMatch ? hsMatch[1] : EMPTY_FORM.healthScore;

      // zone : forcer majuscule
      const zone = get('zone', EMPTY_FORM.zone).toUpperCase().replace(/zone\s*/i, '') || EMPTY_FORM.zone;

      // Nettoyer les valeurs numériques SF (1 234,56 € → 1234.56)
      const cleanNum = s => {
        const n = parseFloat(String(s).replace(/[^\d,.]/g, '').replace(/\s/g, '').replace(',', '.'));
        return isNaN(n) ? '' : String(n);
      };
      // Normaliser les dates SF → YYYY-MM-DD (FR locale : DD/MM/YYYY)
      const cleanDate = s => {
        if (!s) return '';
        s = s.trim();
        if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
        const fr = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
        if (fr) return `${fr[3]}-${fr[2].padStart(2,'0')}-${fr[1].padStart(2,'0')}`;
        return '';
      };
      const mrr = cleanNum(get('mrr', EMPTY_FORM.mrr));
      const arr = cleanNum(get('arr', ''));

      // currentDiscount auto-calculé depuis ARR vs prix catalogue, arrondi à 5%
      // Si ARR = ancien prix catalogue (LEGACY_PRICES) → remise = 0 (pas de discount, ancien tarif)
      const arrNum   = parseFloat(arr);
      const catPrice = PRICING[zone]?.upfront?.[offerKey] ?? 0;
      const roundTo5 = n => Math.round(n / 5) * 5;
      const isLegacy = LEGACY_PRICES[offerKey] != null && Math.round(arrNum) === LEGACY_PRICES[offerKey];
      const currentDiscount = arrNum > 0 && catPrice > 0
        ? (isLegacy ? 0 : roundTo5(Math.max(0, Math.round((1 - arrNum / catPrice) * 100))))
        : Number(get('currentDiscount', EMPTY_FORM.currentDiscount));

      return {
        ...EMPTY_FORM,
        account:         get('account',      EMPTY_FORM.account),
        ae:              get('ae',           EMPTY_FORM.ae),
        oppId:           get('oppid',        EMPTY_FORM.oppId),
        zone,
        offer:           offerKey,
        arr,
        currentDiscount,
        mrr,
        nextBilling:     cleanDate(get('nextBilling', EMPTY_FORM.nextBilling)),
        engagement,
        subStart:        get('subStart',     EMPTY_FORM.subStart),
        subStartDate:    get('subStartDate', EMPTY_FORM.subStartDate),
        healthScore,
        band,
        city: (() => { const v = get('city', ''); return v && !v.startsWith('!') ? v : EMPTY_FORM.city; })(),
      };
    }

    // ─── CustomScenarioCard ────────────────────────────────────────────────────
    function CustomScenarioCard({ zone, currentOffer, pricing = null, isSelected, onSelect, lang = 'fr', decoyPosition = null, onDecoyToggle, defaultOpen = false }) {
      const [open, setOpen] = useState(defaultOpen);
      const [offer, setOffer] = useState('');
      const [discount, setDiscount] = useState(0);

      const offerOptions = OFFER_KEYS.filter(k => k !== 'joy-only');
      const catalogPrice = (pricing ?? PRICING[zone])?.upfront?.[offer] ?? 0;
      const negotiated   = catalogPrice * (1 - discount / 100);

      const handleConfirm = () => {
        if (!offer) return;
        const scenario = {
          offer, label: 'Offre personnalisée', rules: null,
          notRecommended: false, rank: 0, recommended: false, isCustom: true,
        };
        onSelect(scenario, discount);
      };

      const t = TR[lang];
      return (
        <div style={{ background: 'white', border: `1.5px dashed ${isSelected ? C.purple : C.border}`, borderRadius: 16, padding: '16px 20px', marginTop: 4, position: 'relative' }}>
          {decoyPosition !== null && (
            <div onClick={onDecoyToggle} style={{ position: 'absolute', top: 10, right: 10, width: 26, height: 26, borderRadius: '50%', background: '#7C3AED', color: 'white', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 13, fontWeight: 900, zIndex: 2, boxShadow: '0 2px 8px #7C3AED44', cursor: 'pointer' }}>
              {decoyPosition}
            </div>
          )}
          <button onClick={() => setOpen(o => !o)} style={{
            display: 'flex', alignItems: 'center', gap: 10, background: 'none', border: 'none',
            cursor: 'pointer', padding: 0, width: '100%', textAlign: 'left',
          }}>
            <span style={{ width: 30, height: 30, borderRadius: 8, background: C.purpleLight, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 16, flexShrink: 0 }}>✏️</span>
            <div>
              <p style={{ fontWeight: 700, fontSize: 14, color: C.purple, margin: 0 }}>{t.manualEntry}</p>
              <p style={{ fontSize: 12, color: C.muted, margin: 0 }}>{t.manualEntrySub}</p>
            </div>
            <span style={{ marginLeft: 'auto', color: C.muted, fontSize: 18, lineHeight: 1 }}>{open ? '▾' : '▸'}</span>
          </button>

          {open && (
            <div style={{ marginTop: 16, display: 'flex', flexWrap: 'wrap', gap: 12, alignItems: 'flex-end' }}>
              <div>
                <label style={{ display: 'block', fontSize: 12, fontWeight: 600, color: C.label, marginBottom: 4 }}>{t.offerLabel}</label>
                <select value={offer} onChange={e => setOffer(e.target.value)} style={{
                  fontSize: 13, padding: '7px 10px', borderRadius: 8, border: `1.5px solid ${C.border}`,
                  background: 'white', color: C.text, cursor: 'pointer', minWidth: 140,
                }}>
                  <option value="">{t.choosePlaceholder}</option>
                  {offerOptions.map(k => <option key={k} value={k}>{OFFER_NAMES[k]}</option>)}
                </select>
              </div>
              <div>
                <label style={{ display: 'block', fontSize: 12, fontWeight: 600, color: C.label, marginBottom: 4 }}>{t.discountLabel}</label>
                <input type="number" min={0} max={100} value={discount} onChange={e => setDiscount(Math.max(0, Math.min(100, parseInt(e.target.value) || 0)))} style={{
                  fontSize: 13, padding: '7px 10px', borderRadius: 8, border: `1.5px solid ${C.border}`,
                  background: 'white', color: C.text, width: 90,
                }} />
              </div>
              {offer && (
                <div style={{ fontSize: 12, color: C.muted }}>
                  <span>{t.catalogue} : {fmt(catalogPrice)}{t.perYear}</span>
                  {discount > 0 && <span> → {t.negotiatedPrice} : <strong style={{ color: C.text }}>{fmt(negotiated)}{t.perYear}</strong></span>}
                </div>
              )}
              <button onClick={handleConfirm} disabled={!offer} style={{
                background: offer ? C.purple : '#E5E7EB', color: offer ? 'white' : C.muted,
                border: 'none', borderRadius: 10, padding: '9px 18px', fontWeight: 700, fontSize: 13,
                cursor: offer ? 'pointer' : 'default', whiteSpace: 'nowrap',
              }}>
                {t.selectBtn}
              </button>
            </div>
          )}
        </div>
      );
    }

    // ─── Upsell / Downsell Summary ───────────────────────────────────────────
    function UpsellSummaryCard({ currentArr, newArr, offerName, onConfirm, lang = 'fr' }) {
      const t = TR[lang];
      const hasData  = currentArr > 0 && !isNaN(currentArr);
      const delta    = hasData ? newArr - currentArr : 0;
      const deltaPct = hasData && currentArr > 0 ? (delta / currentArr) * 100 : 0;
      const isUp     = delta > 0.5;
      const isDown   = delta < -0.5;

      const accent    = isUp ? C.green      : isDown ? C.coral    : C.purple;
      const accentL   = isUp ? C.greenLight : isDown ? C.coralLight : C.purpleLight;
      const accentM   = isUp ? '#A7F3D0'   : isDown ? C.coralMid  : C.purpleMid;
      const dirIcon   = isUp ? '📈'        : isDown ? '📉'        : '↔️';
      const typeLabel = isUp ? 'Upsell'    : isDown ? 'Downsell'  : t.renewalSame;

      return (
        <div style={{ background: 'white', border: `1.5px solid ${accentM}`, borderRadius: 16, padding: 24 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 20 }}>
            <SectionIcon color={accent}>{dirIcon}</SectionIcon>
            <div>
              <p style={{ fontWeight: 700, fontSize: 15, color: C.text }}>{t.evolutionTitle}</p>
              <p style={{ fontSize: 12, color: C.muted }}>{t.evolutionSub(offerName)}</p>
            </div>
            <span style={{ marginLeft: 'auto', fontSize: 12, fontWeight: 700, padding: '4px 12px', borderRadius: 20, background: accentL, color: accent, border: `1px solid ${accentM}` }}>
              {typeLabel}
            </span>
          </div>

          <div style={{ display: 'grid', gridTemplateColumns: '1fr auto 1fr 1.2fr', alignItems: 'center', gap: 12, marginBottom: 20 }}>
            <div style={{ borderRadius: 14, padding: '14px 18px', background: '#F9FAFB', border: `1px solid ${C.border}` }}>
              <Label>{t.arrLabel}</Label>
              <p style={{ fontSize: 22, fontWeight: 900, color: C.text }}>{hasData ? fmt(currentArr) : '—'}</p>
              <p style={{ fontSize: 11, color: C.muted }}>{t.perYear}</p>
            </div>
            <div style={{ fontSize: 20, color: C.muted, textAlign: 'center' }}>→</div>
            <div style={{ borderRadius: 14, padding: '14px 18px', background: '#F9FAFB', border: `1px solid ${C.border}` }}>
              <Label>{t.proposedPriceLabel}</Label>
              <p style={{ fontSize: 22, fontWeight: 900, color: C.text }}>{fmt(newArr)}</p>
              <p style={{ fontSize: 11, color: C.muted }}>{offerName} {t.perYear}</p>
            </div>
            <div style={{ borderRadius: 14, padding: '14px 18px', background: accentL, border: `1.5px solid ${accentM}`, textAlign: 'center' }}>
              <p style={{ fontSize: 12, fontWeight: 600, color: accent, marginBottom: 6 }}>{t.variationLabel}</p>
              <p style={{ fontSize: 24, fontWeight: 900, color: accent }}>
                {!hasData ? '—' : `${delta >= 0 ? '+' : ''}${fmt(delta)}`}
              </p>
              <p style={{ fontSize: 14, fontWeight: 700, color: accent, marginTop: 4 }}>
                {!hasData ? t.noArr : `${deltaPct >= 0 ? '+' : ''}${deltaPct.toFixed(1)}%`}
              </p>
            </div>
          </div>

          <button onClick={onConfirm} style={{
            width: '100%', padding: '14px 0', borderRadius: 12, fontSize: 14, fontWeight: 800,
            border: 'none', cursor: 'pointer', transition: 'all .15s',
            background: C.purple, color: 'white',
            boxShadow: `0 4px 16px ${C.purple}44`,
            letterSpacing: '.01em',
          }}>
            {t.seeSchedules}
          </button>
        </div>
      );
    }

    // ─── App ─────────────────────────────────────────────────────────────────
    function App() {
      const [form,              setForm]              = useState(fromUrl);
      const [submitted,         setSubmitted]         = useState(false);
      const [discounts,         setDiscounts]         = useState({});
      const [discountsFacilite, setDiscountsFacilite] = useState({});
      const [selectedIdx,       setSelectedIdx]       = useState(null);
      const [selectedPayment,   setSelectedPayment]   = useState(null);
      const [demoMode,          setDemoMode]          = useState(false);
      const [step,              setStep]              = useState(0);
      const [slideDir,          setSlideDir]          = useState('fwd');
      const [customScenario,    setCustomScenario]    = useState(null);
      const [customDiscount,    setCustomDiscount]    = useState(0);
      const [customDiscountFac, setCustomDiscountFac] = useState(0);
      const [upfrontTimes,      setUpfrontTimes]      = useState(1);
      const [decoyMode,    setDecoyMode]    = useState(false);
      const [decoyList,    setDecoyList]    = useState([]); // tableau de clés : index scénario (0,1,2...) ou -1 pour custom
      const [unchurnMode,  setUnchurnMode]  = useState(false);
      const upsellCardRef = useRef(null);

      const toggleDecoyMode = () => {
        setDecoyMode(m => {
          if (m) { setDecoyList([]); return false; }
          // En activant, initialiser avec la sélection courante si existante
          if (selectedIdx !== null) setDecoyList([selectedIdx]);
          return true;
        });
      };

      const handleDecoyToggle = (key) => {
        const pos = decoyList.indexOf(key);
        if (pos >= 0) {
          const next = decoyList.filter(k => k !== key);
          setDecoyList(next);
          if (pos === 0) {
            setSelectedIdx(next.length > 0 ? next[0] : null);
            setSelectedPayment(null);
          }
        } else {
          const next = [...decoyList, key];
          setDecoyList(next);
          if (decoyList.length === 0) {
            setSelectedIdx(key === -1 ? -1 : key);
            setSelectedPayment(null);
            setTimeout(() => upsellCardRef.current?.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 80);
          }
        }
      };

      const [amMapping,         setAmMapping]         = useState({});

      useEffect(() => {
        fetch('/am-mapping').then(r => r.json()).then(setAmMapping).catch(() => {});
      }, []);


      const goTo = (target) => {
        setSlideDir(target > step ? 'fwd' : 'back');
        if (target === 0) setUnchurnMode(false);
        setStep(target);
      };

      const resetDownstream = () => {
        setSubmitted(false); setSelectedIdx(null); setSelectedPayment(null);
        setDiscounts({}); setDiscountsFacilite({}); setStep(0);
        setCustomScenario(null); setCustomDiscount(0); setCustomDiscountFac(0); setUpfrontTimes(1);
        setDecoyMode(false); setDecoyList([]);
        setUnchurnMode(false);
      };

      const onChange = (key, val) => {
        setForm(f => {
          const next = { ...f, [key]: val };
          if (key === 'arr' || key === 'offer' || key === 'zone') {
            const arrNum   = parseFloat(String(key === 'arr' ? val : next.arr).replace(',', '.'));
            const catPrice = PRICING[next.zone]?.upfront?.[next.offer] ?? 0;
            if (arrNum > 0 && catPrice > 0) {
              const legacy = LEGACY_PRICES[next.offer];
              next.currentDiscount = (legacy != null && Math.round(arrNum) === legacy)
                ? 0
                : Math.round(Math.max(0, Math.round((1 - arrNum / catPrice) * 100)) / 5) * 5;
            }
          }
          return next;
        });
        if (['offer', 'healthScore', 'band', 'zone', 'city'].includes(key)) resetDownstream();
      };

      const onSubmit = () => {
        setSelectedIdx(null); setSelectedPayment(null);
        setDiscounts({}); setDiscountsFacilite({});
        setSubmitted(true);
        setUnchurnMode(false);
        goTo(1);
      };

      const onUnchurn = () => {
        setSelectedIdx(null); setSelectedPayment(null);
        setCustomScenario(null); setCustomDiscount(0); setCustomDiscountFac(0);
        setDiscounts({}); setDiscountsFacilite({});
        setSubmitted(true);
        setUnchurnMode(true);
        goTo(1);
      };

      const amNameDisplay = amMapping[form.ae] || form.ae;
      const lang = SPANISH_AMS.some(n => amNameDisplay.toLowerCase().includes(n)) ? 'es' : 'fr';
      const effectiveZone = lang === 'es' ? 'B' : form.zone;
      const activePricingNew = (form.catalogueNew || '2026') === '2025' ? PRICING_2025 : PRICING[effectiveZone];

      const hsNum    = parseInt(form.healthScore);
      const offerCap = getOfferCap(effectiveZone, form.city);
      const scenarios = useMemo(
        () => submitted ? computeScenarios(hsNum, form.band, form.offer, offerCap) : [],
        [submitted, hsNum, form.band, form.offer, offerCap]
      );
      const prorata = useMemo(
        () => computeProrata(form, TR[lang].dateLocale),
        [form.subStart, form.subStartDate, form.nextBilling, form.mrr, lang]
      );

      const handleDiscount = (idx, val) => {
        setDiscounts(p => ({ ...p, [idx]: val }));
        if (selectedIdx === idx) setSelectedPayment(null);
      };
      const handleDiscountFacilite = (val) => {
        if (selectedIdx === -1) setCustomDiscountFac(val);
        else setDiscountsFacilite(p => ({ ...p, [selectedIdx]: val }));
      };
      const handleSelect = idx => {
        setSelectedIdx(idx); setSelectedPayment(null);
        setTimeout(() => upsellCardRef.current?.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 80);
      };
      const handleSelectCustom = (scenario, discount) => {
        setCustomScenario(scenario); setCustomDiscount(discount); setCustomDiscountFac(0);
        setSelectedIdx(-1); setSelectedPayment(null);
        setTimeout(() => upsellCardRef.current?.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 80);
      };
      const handlePaymentSelect = (mode) => {
        setSelectedPayment(mode); goTo(3);
      };

      const decoyItems = decoyMode && decoyList.length >= 2
        ? decoyList.map(key => {
            if (key === -1) return customScenario ? { scenario: customScenario, discount: customDiscount } : null;
            const s = scenarios[key];
            return s ? { scenario: s, discount: discounts[key] ?? 0 } : null;
          }).filter(Boolean)
        : [];

      const payStart = (form.subStart === 'early' && form.subStartDate) ? form.subStartDate
                     : form.nextBilling || '';

      const selectedScenario       = selectedIdx === -1 ? customScenario
                                   : selectedIdx !== null ? scenarios[selectedIdx] : null;
      const selectedDiscount       = selectedIdx === -1 ? customDiscount
                                   : selectedIdx !== null ? (discounts[selectedIdx] ?? 0) : 0;
      const selectedDiscountFac    = selectedIdx === -1 ? customDiscountFac
                                   : selectedIdx !== null ? (discountsFacilite[selectedIdx] ?? 0) : 0;
      const bm                     = BAND_META[form.band];
      const colCls = { 1: '1fr', 2: '1fr 1fr', 3: '1fr 1fr 1fr', 4: '1fr 1fr' }[scenarios.length] ?? '1fr 1fr 1fr';

      const BackButton = ({ to, label = 'Retour' }) => (
        <button onClick={() => goTo(to)} style={{
          display: 'inline-flex', alignItems: 'center', gap: 8,
          background: 'white', border: `1.5px solid ${C.border}`,
          borderRadius: 12, cursor: 'pointer',
          fontSize: 14, fontWeight: 700, color: C.text,
          padding: '10px 18px', marginBottom: 8,
          boxShadow: '0 1px 4px rgba(0,0,0,.06)',
          transition: 'box-shadow .15s, border-color .15s',
        }}
          onMouseEnter={e => { e.currentTarget.style.borderColor = C.purple; e.currentTarget.style.color = C.purple; }}
          onMouseLeave={e => { e.currentTarget.style.borderColor = C.border; e.currentTarget.style.color = C.text; }}
        >
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
            <path d="M19 12H5M12 5l-7 7 7 7"/>
          </svg>
          {label}
        </button>
      );

      return (
        <div style={{ minHeight: '100vh', background: C.bg }}>

          {/* Header */}
          <div style={{ background: 'white', borderBottom: `1px solid ${C.border}`, padding: '0 32px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', height: 60, position: 'sticky', top: 0, zIndex: 10 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
              <div style={{ width: 36, height: 36, borderRadius: 10, background: C.purpleLight, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 18 }}>🔄</div>
              <div>
                <p style={{ fontWeight: 800, fontSize: 15, color: C.text, lineHeight: 1.2 }}>Simulateur Renewal</p>
                <p style={{ fontSize: 11, color: C.muted }}>
                  {!demoMode && step === 0 && 'Informations client'}
                  {!demoMode && step === 1 && 'Recommandations d\'offre'}
                  {!demoMode && step === 2 && 'Mode de paiement'}
                  {!demoMode && step === 3 && 'Résumé'}
                  {demoMode && 'Mode Démo'}
                </p>
              </div>
            </div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
              <span style={{ fontSize: 13, fontWeight: demoMode ? 700 : 400, color: demoMode ? C.purple : C.muted, transition: 'color .3s' }}>Mode Démo</span>
              <Toggle value={demoMode} onChange={setDemoMode} />
            </div>
          </div>

          {/* Contenu principal */}
          {demoMode ? (
            /* ── Mode Démo : pas de navigation par étapes ── */
            <div style={{ maxWidth: '100%', margin: '0 auto', padding: '32px 48px', display: 'flex', flexDirection: 'column', gap: 24, fontSize: '112%' }}>
              {selectedScenario && (
                <Card style={{ padding: 40 }}>
                  <PaymentSection
                    scenario={selectedScenario} discountValue={selectedDiscount}
                    discountFacilite={selectedDiscountFac} onDiscountFaciliteChange={handleDiscountFacilite}
                    zone={effectiveZone} selectedPayment={selectedPayment} onPaymentSelect={handlePaymentSelect}
                    prorata={prorata} demoMode={true} startDate={payStart} lang={lang}
                  />
                </Card>
              )}
              {selectedScenario && selectedPayment && (
                <Card style={{ padding: 40 }}>
                  <OutputSection form={form} scenario={selectedScenario} discountValue={selectedDiscount}
                    discountFacilite={selectedDiscountFac} payment={selectedPayment} prorata={prorata} demoMode={true} amName={amMapping[form.ae] || form.ae} lang={lang} zone={effectiveZone} decoyMode={decoyMode} decoyItems={decoyItems} />
                </Card>
              )}
            </div>
          ) : (
            /* ── Mode normal : navigation par étapes avec slide ── */
            <div key={step} className={`page-${slideDir}`} style={{
              maxWidth: 1100, margin: '0 auto', padding: '32px 24px',
              display: 'flex', flexDirection: 'column', gap: 24,
            }}>

              {/* Étape 0 — Formulaire */}
              {step === 0 && (
                <>
                  {[...new URLSearchParams(window.location.search).keys()].length > 0 && (
                    <div style={{ background: C.purpleLight, border: `1px solid ${C.purpleMid}`, borderRadius: 12, padding: '10px 18px', display: 'flex', alignItems: 'center', gap: 10 }}>
                      <span style={{ fontSize: 16 }}>⚡</span>
                      <span style={{ fontSize: 13, fontWeight: 600, color: C.purple }}>Données pré-remplies depuis Salesforce — vérifiez et complétez si besoin.</span>
                    </div>
                  )}
                  <ClientForm form={form} onChange={onChange} onSubmit={onSubmit} onUnchurn={onUnchurn} amMapping={amMapping} lang={lang} />
                </>
              )}

              {/* Étape 1 — Unchurn mode */}
              {step === 1 && unchurnMode && (
                <>
                <BackButton to={0} label={TR[lang].editProfile} />
                <Card style={{ padding: 28 }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 24 }}>
                    <SectionIcon color={C.coral}>🔴</SectionIcon>
                    <div>
                      <p style={{ fontWeight: 700, fontSize: 15, color: C.text }}>Unchurn mode</p>
                      <p style={{ fontSize: 12, color: C.muted }}>{TR[lang].unchurnSub}</p>
                    </div>
                  </div>
                  <CustomScenarioCard
                    zone={effectiveZone} currentOffer={form.offer} pricing={activePricingNew}
                    isSelected={selectedIdx === -1}
                    defaultOpen={true}
                    onSelect={(sc, disc) => { handleSelectCustom(sc, disc); goTo(2); }}
                    lang={lang} />
                </Card>
                </>
              )}

              {/* Étape 1 — Recommandations */}
              {step === 1 && !unchurnMode && scenarios.length > 0 && (
                <>
                <BackButton to={0} label={TR[lang].editProfile} />
                <Card style={{ padding: 28 }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 20 }}>
                    <SectionIcon color={C.coral}>🎯</SectionIcon>
                    <div style={{ flex: 1 }}>
                      <p style={{ fontWeight: 700, fontSize: 15, color: C.text }}>{TR[lang].offerRecommendations}</p>
                      <p style={{ fontSize: 12, color: C.muted }}>{TR[lang].offerRecommendationsSub}</p>
                      {offerCap && (
                        <p style={{ fontSize: 11, marginTop: 4, color: '#92400E', background: '#FFFBEB', padding: '2px 8px', borderRadius: 6, border: '1px solid #FDE68A', display: 'inline-block' }}>
                          {TR[lang].offerCapNote(OFFER_NAMES[offerCap])}
                        </p>
                      )}
                    </div>
                    <button onClick={toggleDecoyMode} style={{
                      display: 'flex', alignItems: 'center', gap: 6,
                      padding: '7px 14px', borderRadius: 20, fontSize: 12, fontWeight: 700,
                      border: `1.5px solid ${decoyMode ? '#7C3AED' : C.border}`,
                      background: decoyMode ? '#F3E8FF' : 'white',
                      color: decoyMode ? '#7C3AED' : C.muted,
                      cursor: 'pointer', transition: 'all .15s',
                    }}>
                      <span>{decoyMode ? '🎭' : '🎭'}</span>
                      {decoyList.length >= 2 && decoyMode
                        ? `Sélection de plusieurs offres — ${decoyList.length} offres ✓`
                        : 'Sélection de plusieurs offres'}
                    </button>
                  </div>
                  <div style={{ display: 'flex', gap: 8, marginBottom: 20, flexWrap: 'wrap' }}>
                    {[
                      { label: `Health Score ${hsNum}% — ${hsNum <= 70 ? TR[lang].fragile.replace('⚠️ ','') : TR[lang].healthy.replace('✅ ','')}`, bg: hsNum <= 70 ? C.coralLight : C.greenLight, color: hsNum <= 70 ? C.coral : C.green, border: hsNum <= 70 ? C.coralMid : '#A7F3D0' },
                      bm && { label: `${bm.emoji} ${bm.label}`, bg: C.purpleLight, color: C.purple, border: C.purpleMid },
                    ].filter(Boolean).map((p, i) => (
                      <span key={i} style={{ fontSize: 12, fontWeight: 600, padding: '5px 12px', borderRadius: 20, background: p.bg, color: p.color, border: `1px solid ${p.border}` }}>{p.label}</span>
                    ))}
                  </div>
                  <div style={{ display: 'grid', gridTemplateColumns: colCls, gap: 16 }}>
                    {scenarios.map((s, i) => (
                      <ScenarioCard key={`${s.offer}-${i}`} scenario={s}
                        discount={discounts[i] ?? 0} onDiscountChange={val => handleDiscount(i, val)}
                        zone={effectiveZone} pricing={activePricingNew}
                        isSelected={decoyMode ? decoyList.includes(i) : selectedIdx === i}
                        decoyPosition={decoyMode ? (decoyList.indexOf(i) >= 0 ? decoyList.indexOf(i) + 1 : null) : null}
                        onSelect={decoyMode ? () => handleDecoyToggle(i) : handleSelect}
                        lang={lang} />
                    ))}
                  </div>
                </Card>
                <CustomScenarioCard zone={effectiveZone} currentOffer={form.offer} pricing={activePricingNew}
                  isSelected={decoyMode ? decoyList.includes(-1) : selectedIdx === -1}
                  decoyPosition={decoyMode ? (decoyList.indexOf(-1) >= 0 ? decoyList.indexOf(-1) + 1 : null) : null}
                  onSelect={decoyMode ? (sc, disc) => { handleSelectCustom(sc, disc); handleDecoyToggle(-1); } : handleSelectCustom}
                  onDecoyToggle={decoyMode ? () => handleDecoyToggle(-1) : undefined}
                  lang={lang} />
                {decoyMode && decoyList.length >= 1 ? (
                  <div ref={upsellCardRef}>
                    {decoyList.map((key, idx) => {
                      const item = key === -1
                        ? (customScenario ? { scenario: customScenario, discount: customDiscount } : null)
                        : (scenarios[key] ? { scenario: scenarios[key], discount: discounts[key] ?? 0 } : null);
                      if (!item) return null;
                      const cat = activePricingNew?.upfront?.[item.scenario.offer] ?? 0;
                      const neg = cat * (1 - item.discount / 100);
                      return (
                        <div key={key} style={{ marginBottom: 8 }}>
                          <div style={{ fontSize: 12, fontWeight: 700, color: '#7C3AED', marginBottom: 4, paddingLeft: 6, display: 'flex', alignItems: 'center', gap: 6 }}>
                            <span style={{ width: 20, height: 20, borderRadius: '50%', background: '#7C3AED', color: 'white', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', fontSize: 11, fontWeight: 900 }}>{idx + 1}</span>
                            Offre {idx + 1}
                          </div>
                          <UpsellSummaryCard
                            currentArr={parseFloat(form.arr) > 0 ? parseFloat(form.arr) : parseFloat(form.mrr) * 12}
                            newArr={neg}
                            offerName={OFFER_NAMES[item.scenario.offer] || item.scenario.offer}
                            onConfirm={() => goTo(2)}
                            lang={lang}
                          />
                        </div>
                      );
                    })}
                  </div>
                ) : selectedScenario && (
                  <div ref={upsellCardRef}>
                    <UpsellSummaryCard
                      currentArr={parseFloat(form.arr) > 0 ? parseFloat(form.arr) : parseFloat(form.mrr) * 12}
                      newArr={(activePricingNew?.upfront?.[selectedScenario.offer] ?? 0) * (1 - selectedDiscount / 100)}
                      offerName={OFFER_NAMES[selectedScenario.offer] || selectedScenario.offer}
                      onConfirm={() => goTo(2)}
                      lang={lang}
                    />
                  </div>
                )}
                </>
              )}

              {/* Étape 2 — Échéancier */}
              {step === 2 && selectedScenario && (
                <>
                <BackButton to={1} label={TR[lang].backToOffers} />
                <Card style={{ padding: 28 }}>
                  <PaymentSection
                    scenario={selectedScenario} discountValue={selectedDiscount}
                    onDiscountChange={val => {
                      if (selectedIdx === -1) setCustomDiscount(val);
                      else { setDiscounts(p => ({ ...p, [selectedIdx]: val })); setSelectedPayment(null); }
                    }}
                    discountFacilite={selectedDiscountFac} onDiscountFaciliteChange={handleDiscountFacilite}
                    zone={effectiveZone} pricing={activePricingNew} selectedPayment={selectedPayment} onPaymentSelect={handlePaymentSelect}
                    prorata={prorata} demoMode={false} startDate={payStart}
                    upfrontTimes={upfrontTimes} setUpfrontTimes={setUpfrontTimes} lang={lang}
                  />
                </Card>
                </>
              )}

              {/* Étape 3 — Résumé */}
              {step === 3 && selectedScenario && selectedPayment && (
                <>
                <BackButton to={2} label={TR[lang].backToSchedule} />
                <Card style={{ padding: 28 }}>
                  <OutputSection form={form} scenario={selectedScenario} discountValue={selectedDiscount}
                    discountFacilite={selectedDiscountFac} payment={selectedPayment} prorata={prorata} demoMode={false} upfrontTimes={upfrontTimes}
                    amName={amMapping[form.ae] || form.ae} lang={lang} zone={effectiveZone} decoyMode={decoyMode} decoyItems={decoyItems} />
                </Card>
                <SaveCaseBlock form={form} scenario={selectedScenario} discountValue={selectedDiscount} payment={selectedPayment} />
                </>
              )}

              <p style={{ textAlign: 'center', fontSize: 11, color: C.label, paddingBottom: 16 }}>Simulateur Renewal Joy · {new Date().getFullYear()}</p>
            </div>
          )}
        </div>
      );
    }

    class ErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { error: null }; }
      static getDerivedStateFromError(err) { return { error: err }; }
      componentDidCatch(err, info) { console.error('React crash:', err, info); }
      render() {
        if (this.state.error) {
          const e = this.state.error;
          return (
            <div style={{ padding: 32, fontFamily: 'monospace', fontSize: 13, color: '#B91C1C', background: '#FEF2F2', border: '1px solid #FCA5A5', borderRadius: 12, margin: 24 }}>
              <b>Erreur React :</b><br />
              {e.message}<br />
              <pre style={{ marginTop: 8, whiteSpace: 'pre-wrap', fontSize: 11 }}>{e.stack && e.stack.substring(0, 800)}</pre>
            </div>
          );
        }
        return this.props.children;
      }
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App /></ErrorBoundary>);
  </script>
</body>
</html>
